<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061522">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Conecta Serviços"><meta name="description" content="Conecta Serviços — marketplace de profissionais e clientes">
<title>Conecta Serviços</title>
<style>
:root{--bg:#061522;--bg2:#0b2030;--card:#10293a;--card2:#0d2232;--line:#29465a;--yellow:#ffc21a;--yellow2:#ffdc56;--green:#21c77a;--red:#f04444;--text:#f7fbff;--muted:#9db0bd;--blue:#1d79ff;--shadow:0 14px 35px #0007;--r:18px}*{box-sizing:border-box}html,body{margin:0;background:#030d16;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:radial-gradient(circle at 50% -10%,#12364d 0,#061522 38%,#030c14 100%)}.screen{display:none;min-height:100vh}.screen.active{display:block}.shell{width:min(1120px,100%);margin:auto;padding:18px 16px 100px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,var(--yellow2),#f6a800);color:#061522;display:grid;place-items:center;font-size:28px;font-weight:1000;box-shadow:0 7px 20px #ffc21a33}.logo.sm{width:36px;height:36px;font-size:24px;border-radius:11px}.brand b{font-size:20px}.brand b span{color:var(--yellow)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.iconbtn{border:1px solid var(--line);background:#091c2a;color:white;width:42px;height:42px;border-radius:13px}.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;transition:.15s}.btn:active{transform:scale(.98)}.primary{background:var(--yellow);color:#101a20}.outline{background:transparent;color:white;border:1px solid #7890a0}.danger{background:var(--red);color:white}.success{background:var(--green);color:#052015}.ghost{background:#10283a;color:white;border:1px solid var(--line)}.full{width:100%}.muted{color:var(--muted)}.tiny{font-size:12px}.title{font-size:26px;margin:8px 0}.subtitle{color:var(--muted);line-height:1.5}.card{background:linear-gradient(160deg,#122d40,#091c2a);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:13px;color:#c9d6de;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #385267;background:#071a28;color:white;border-radius:13px;padding:13px;outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--yellow)}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;background:#193548;color:#dceaf1}.pill.green{background:#073f2a;color:#62e9a9}.pill.yellow{background:#4a3b06;color:#ffe06a}.pill.red{background:#4c1717;color:#ff8b8b}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#23465a;border:2px solid var(--yellow)}.avatar.lg{width:68px;height:68px}.row{display:flex;align-items:center;gap:12px}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.divider{height:1px;background:#274254;margin:14px 0}.price{font-size:19px;font-weight:950;color:#39df91}.stars{color:#ffd34e}.bottom{position:fixed;z-index:20;left:0;right:0;bottom:0;background:#061522ee;border-top:1px solid #29465a;backdrop-filter:blur(15px);display:flex;justify-content:center}.bottom .inner{width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.navbtn{border:0;background:transparent;color:#91a5b3;padding:10px 4px 9px;font-size:11px}.navbtn.active{color:var(--yellow)}.navbtn .ico{font-size:20px;display:block;margin-bottom:2px}.hero{padding:18px;border-radius:22px;background:linear-gradient(135deg,#152f40,#071722);border:1px solid #315064;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-80px;bottom:-100px;width:260px;height:260px;border-radius:50%;border:24px solid #ffc21a1c}.search{display:flex;align-items:center;gap:8px;background:#081b29;border:1px solid #3a5668;border-radius:14px;padding:4px 8px;margin:14px 0}.search input{flex:1;background:transparent;border:0;color:white;padding:10px;outline:0}.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.cat{background:#102a3b;border:1px solid #294658;border-radius:15px;padding:12px 7px;text-align:center;color:#dce7ed;font-size:11px;font-weight:800}.cat .cico{font-size:22px;margin-bottom:6px}.cat:hover{border-color:var(--yellow)}.pro{cursor:pointer}.prohead{display:flex;align-items:center;justify-content:space-between;gap:10px}.pro .name{font-weight:900}.pro .city{font-size:12px;color:var(--muted);margin-top:2px}.pro .cover{height:120px;border-radius:13px;background:linear-gradient(120deg,#18384d,#0a1822);margin:-1px -1px 12px;position:relative;overflow:hidden}.cover .tool{position:absolute;font-size:75px;right:20px;bottom:-10px;filter:drop-shadow(0 8px 10px #0008)}.featured{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:13px;background:#0b2030;border:1px solid var(--line);border-radius:15px}.stat strong{font-size:20px}.stat span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.list{display:grid;gap:10px}.item{background:#0c2130;border:1px solid var(--line);border-radius:15px;padding:13px}.item .actions{display:flex;gap:8px;margin-top:10px}.item .actions .btn{flex:1;padding:10px}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tab{white-space:nowrap;border:1px solid var(--line);background:#0b2030;color:#aebdc6;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:800}.tab.active{background:var(--yellow);color:#111}.modal{position:fixed;z-index:50;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.modalbox{width:min(620px,100%);max-height:92vh;overflow:auto;background:#071a28;border:1px solid #385267;border-radius:24px 24px 0 0;padding:18px;box-shadow:0 -20px 60px #000b}.toast{position:fixed;z-index:100;left:50%;bottom:85px;transform:translateX(-50%) translateY(15px);background:#102b3d;border:1px solid #496275;padding:12px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.auth{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 0,#173c52,#061522 45%,#020a11)}.authbox{width:min(440px,100%);text-align:center}.authlogo{width:82px;height:82px;margin:0 auto 12px;border-radius:28px;background:linear-gradient(145deg,#ffe16c,#f5aa00);color:#061522;display:grid;place-items:center;font-size:56px;font-weight:1000;box-shadow:0 20px 60px #ffc21a25}.auth h1{font-size:30px;margin:4px 0}.auth h1 span{color:var(--yellow)}.authcard{text-align:left;margin-top:20px}.role{display:grid;grid-template-columns:repeat(3,1fr);background:#071522;border:1px solid var(--line);border-radius:14px;padding:4px}.role button{border:0;background:transparent;color:#9fb0bb;padding:10px 5px;border-radius:10px;font-weight:800}.role button.active{background:var(--yellow);color:#111}.demo{font-size:11px;line-height:1.5;text-align:left;background:#0b2232;border:1px dashed #456174;border-radius:12px;padding:10px;color:#aebdc6}.adminhead{background:linear-gradient(135deg,#162f42,#091925);border:1px solid #385267;border-radius:20px;padding:16px}.dangerline{border-color:#743636}.empty{text-align:center;padding:28px;color:var(--muted)}.kpi{font-size:25px;font-weight:950}.right{margin-left:auto}@media(max-width:700px){.shell{padding-left:12px;padding-right:12px}.featured,.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.catgrid{grid-template-columns:repeat(4,1fr)}.statgrid{grid-template-columns:repeat(2,1fr)}.title{font-size:22px}.hero{padding:15px}.cover{height:105px!important}}
</style></head>
<body><div class="app" id="app"></div><div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<script>
const KEY='conecta_servicos_v4';
const ADMIN_WHATSAPP='5579999055301';
function adminWhatsApp(message){
  const text=encodeURIComponent(message||'Olá! Vim pelo Conecta Serviços.');
  window.open('https://wa.me/'+ADMIN_WHATSAPP+'?text='+text,'_blank','noopener');
}
function registrationMessage(u){
  return `Olá ADM! Novo cadastro no Conecta Serviços.%0A%0ATipo: ${u.role==='pro'?'PROFISSIONAL':'CLIENTE'}%0ANome: ${u.name}%0AE-mail: ${u.email}%0ATelefone: ${u.phone||'Não informado'}%0ACidade: ${u.city||'Não informada'}%0A%0A${u.role==='pro'?'Quero contratar o acesso mensal para profissional.':'Novo cliente cadastrado na plataforma.'}`;
}
const seed={session:null,users:[
{id:1,name:'Jeferson Carvalho',email:'jefersoncarvalho252@gmail.com',phone:'',password:'ben2018',role:'admin',city:'',status:'Ativo'}
],requests:[],payments:[],settings:{planPrice:4.99}};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;
function save(){localStorage.setItem(KEY,JSON.stringify(db))} function me(){return db.users.find(u=>u.id===db.session)} function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})} function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2400)}
function modal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
const cats=[['🏠','Construção'],['⚡','Elétrica'],['🚰','Hidráulica'],['🧹','Limpeza'],['🎨','Pintura'],['🌱','Jardinagem'],['🛠️','Manutenção'],['•••','Mais']];
function nav(role,active){return `<div class="bottom"><div class="inner">${role==='client'?`<button class="navbtn ${active==='home'?'active':''}" onclick="renderClient('home')"><span class="ico">⌂</span>Início</button><button class="navbtn ${active==='requests'?'active':''}" onclick="renderClient('requests')"><span class="ico">▤</span>Solicitações</button><button class="navbtn ${active==='favorites'?'active':''}" onclick="renderClient('favorites')"><span class="ico">♡</span>Favoritos</button><button class="navbtn ${active==='profile'?'active':''}" onclick="renderClient('profile')"><span class="ico">♙</span>Perfil</button>`:role==='pro'?`<button class="navbtn ${active==='home'?'active':''}" onclick="renderPro('home')"><span class="ico">⌂</span>Início</button><button class="navbtn ${active==='requests'?'active':''}" onclick="renderPro('requests')"><span class="ico">♧</span>Solicitações</button><button class="navbtn ${active==='finance'?'active':''}" onclick="renderPro('finance')"><span class="ico">▣</span>Financeiro</button><button class="navbtn ${active==='profile'?'active':''}" onclick="renderPro('profile')"><span class="ico">♙</span>Perfil</button>`:`<button class="navbtn ${active==='home'?'active':''}" onclick="renderAdmin('home')"><span class="ico">⌂</span>Início</button><button class="navbtn ${active==='users'?'active':''}" onclick="renderAdmin('users')"><span class="ico">♙</span>Usuários</button><button class="navbtn ${active==='finance'?'active':''}" onclick="renderAdmin('finance')"><span class="ico">▣</span>Financeiro</button><button class="navbtn ${active==='profile'?'active':''}" onclick="renderAdmin('profile')"><span class="ico">⚙</span>Perfil</button>`}</div></div>`}
function auth(){document.getElementById('app').innerHTML=`<div class="screen active"><div class="auth"><div class="authbox"><div class="authlogo">C</div><h1>Conecta <span>Serviços</span></h1><p class="subtitle">O serviço que você precisa,<br>com os profissionais que você confia.</p><div class="card authcard"><div class="role"><button id="rclient" class="active" onclick="setRole('client')">Cliente</button><button id="rpro" onclick="setRole('pro')">Profissional</button><button id="radmin" onclick="setRole('admin')">ADM</button></div><div class="field"><label>E-mail ou telefone</label><input id="loginEmail" autocomplete="username" placeholder="Digite seu e-mail"></div><div class="field"><label>Senha</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Digite sua senha"></div><label class="tiny"><input id="rememberMe" type="checkbox" checked> Lembrar-me</label><button class="btn primary full" style="margin-top:15px" onclick="login()">Entrar</button><button id="installBtn" class="btn primary full" style="margin-top:10px" onclick="installApp()">📲 Instalar aplicativo</button><p class="tiny muted" style="text-align:center;margin:15px 0 5px">Não tem uma conta? <a href="#" onclick="register();return false" style="color:var(--yellow)">Cadastre-se</a></p></div></div></div></div>`}

let selectedRole='client';function setRole(r){selectedRole=r;['client','pro','admin'].forEach(x=>document.getElementById('r'+x).classList.toggle('active',x===r))}function login(){let e=document.getElementById('loginEmail').value.trim().toLowerCase(),pass=document.getElementById('loginPass').value;let u=db.users.find(x=>(x.email||'').toLowerCase()===e||(x.phone||'')===e);if(!u){toast('Usuário não encontrado');return}if(u.status==='Suspenso'){toast('Usuário suspenso');return}if(u.password!==pass){toast('Senha incorreta');return}if(selectedRole!==u.role){toast('Selecione o tipo de conta correto');return}db.session=u.id;save();route()}function logout(){db.session=null;save();auth()}function register(){modal(`<div class="between"><h2>Crear sua conta</h2><button class="iconbtn" onclick="closeModal()">×</button></div><div class="field"><label>Nome completo</label><input id="regName"></div><div class="field"><label>E-mail</label><input id="regEmail"></div><div class="field"><label>Telefone</label><input id="regPhone"></div><div class="field"><label>Tipo de conta</label><select id="regRole"><option value="client">Cliente</option><option value="pro">Profissional</option></select></div><div class="field"><label>Cidade</label><input id="regCity"></div><div class="field"><label>Senha</label><input id="regPass" type="password" autocomplete="new-password"></div><button class="btn primary full" onclick="createAccount()">Criar conta</button>`)}function createAccount(){
  let name=document.getElementById('regName').value.trim(),
      email=document.getElementById('regEmail').value.trim().toLowerCase(),
      pass=document.getElementById('regPass').value,
      phone=document.getElementById('regPhone').value.trim(),
      city=document.getElementById('regCity').value.trim(),
      role=document.getElementById('regRole').value;
  if(!name||!email||!pass){toast('Preencha nome, e-mail e senha');return}
  if(db.users.some(u=>u.email===email)){toast('E-mail já cadastrado');return}
  let id=Math.max(0,...db.users.map(u=>Number(u.id)||0))+1;
  const user={id,name,email,phone,role,city,password:pass,status:'Ativo',
    profession:role==='pro'?'Prestador de serviços':'',price:0,rating:5,
    service:'Manutenção',verified:false,subscription:false};
  db.users.push(user);
  db.session=id;
  save();
  closeModal();
  route();
  toast('Conta criada com sucesso!');
  // O GitHub Pages não sincroniza localStorage entre aparelhos.
  // Por isso, o cadastro é encaminhado imediatamente ao WhatsApp do ADM.
  setTimeout(()=>adminWhatsApp(
    `Olá ADM! Novo cadastro no Conecta Serviços.\n\nTipo: ${role==='pro'?'PROFISSIONAL':'CLIENTE'}\nNome: ${name}\nE-mail: ${email}\nTelefone: ${phone||'Não informado'}\nCidade: ${city||'Não informada'}\n\n${role==='pro'?'Quero contratar o acesso mensal para profissional.':'Novo cliente cadastrado na plataforma.'}`
  ),250);
}
function route(){let u=me();if(!u){auth();return}if(u.role==='client')renderClient('home');else if(u.role==='pro')renderPro('home');else renderAdmin('home')}
function header(title,sub=''){return `<div class="top"><div class="brand"><div class="logo sm">C</div><div><b>Conecta <span>Serviços</span></b>${sub?`<div class="tiny muted">${esc(sub)}</div>`:''}</div></div><button class="iconbtn" onclick="showNotifications()">♧</button></div><h1 class="title">${esc(title)}</h1>`}
function renderClient(page){let u=me();let app=document.getElementById('app');let content='';if(page==='home'){content=`${header('Olá, '+u.name.split(' ')[0]+'!','Encontre os melhores profissionais para o seu serviço.') }<div class="search"><span>⌕</span><input id="q" placeholder="Buscar serviços, profissionais ou categorias" oninput="filterPros()"></div><div class="catgrid">${cats.map(c=>`<button class="cat" onclick="searchCat('${c[1]}')"><div class="cico">${c[0]}</div>${c[1]}</button>`).join('')}</div><div class="card" style="margin:16px 0;background:linear-gradient(110deg,#f5b91b,#0e3140)"><div class="row"><div style="font-size:36px">🛡️</div><div><b>Profissionais verificados e aprovados!</b><div class="tiny" style="color:#10222b;margin-top:4px">Mais segurança e qualidade para você.</div></div></div></div><div class="between"><h2 style="font-size:18px">Profissionais em destaque</h2><button class="btn ghost" style="padding:8px 11px" onclick="renderClient('search')">Ver todos</button></div><div id="prolist" class="featured">${proCards(db.users.filter(x=>x.role==='pro').slice(0,4))}</div>`}else if(page==='search'){content=`${header('Encontrar profissionais')}<div class="search"><span>⌕</span><input id="q" placeholder="Digite serviço, categoria ou nome" oninput="filterPros()"></div><div class="tabs">${cats.slice(0,7).map(c=>`<button class="tab" onclick="searchCat('${c[1]}')">${c[1]}</button>`).join('')}</div><div id="prolist" class="grid g2">${proCards(db.users.filter(x=>x.role==='pro'))}</div>`}else if(page==='requests'){let rs=db.requests.filter(r=>r.clientId===u.id);content=`${header('Minhas solicitações')}<div class="tabs"><button class="tab active">Todas (${rs.length})</button><button class="tab">Em aberto</button><button class="tab">Aceitas</button></div><div class="list">${rs.length?rs.map(requestClientCard).join(''):'<div class="empty">Você ainda não tem solicitações.</div>'}</div>`}else if(page==='favorites'){content=`${header('Favoritos')}<div class="empty card">Você pode favoritar profissionais e encontrá-los aqui.</div>`}else {content=`${header('Meu perfil')}<div class="card"><div class="row"><div class="avatar lg">${u.name[0]}</div><div><h2 style="margin:0">${esc(u.name)}</h2><div class="muted">${esc(u.email)}</div><span class="pill green">● ${u.status}</span></div></div><div class="divider"></div><button class="btn ghost full" onclick="editProfile()">Editar meus dados</button><button class="btn danger full" style="margin-top:10px" onclick="logout()">Sair da conta</button></div>`}app.innerHTML=`<div class="screen active"><div class="shell">${content}</div>${nav('client',page)}</div>`}
function proCards(arr){return arr.map(p=>`<div class="card pro" onclick="viewPro(${p.id})"><div class="cover"><div class="tool">${p.service==='Elétrica'?'⚡':p.service==='Pintura'?'🎨':p.service==='Hidráulica'?'🚰':'🛠️'}</div></div><div class="prohead"><div class="row"><div class="avatar">${p.name[0]}</div><div><div class="name">${esc(p.name)}</div><div class="city">${esc(p.profession||'Profissional')} • ${esc(p.city)}</div></div></div>${p.verified?'<span class="pill green">✓</span>':''}</div><div style="margin-top:9px"><span class="stars">★</span> ${p.rating||5} <span class="muted tiny">(128)</span></div><div class="between" style="margin-top:10px"><span class="muted tiny">${esc(p.service||'Serviços')}</span><b>${money(p.price||0)}</b></div></div>`).join('')}
function filterPros(){let q=(document.getElementById('q')?.value||'').toLowerCase();let list=db.users.filter(p=>p.role==='pro'&&[p.name,p.profession,p.service,p.city].join(' ').toLowerCase().includes(q));let el=document.getElementById('prolist');if(el)el.innerHTML=proCards(list)}function searchCat(c){renderClient('search');setTimeout(()=>{let q=document.getElementById('q');if(q){q.value=c;filterPros()}},0)}
function viewPro(id){let p=db.users.find(x=>x.id===id);modal(`<div class="cover" style="height:150px"><div class="tool">${p.service==='Elétrica'?'⚡':p.service==='Pintura'?'🎨':'🚰'}</div></div><div class="row" style="margin-top:-30px"><div class="avatar lg">${p.name[0]}</div><div><h2 style="margin:0">${esc(p.name)} ${p.verified?'✓':''}</h2><div class="muted">${esc(p.profession)} • ${esc(p.city)}</div></div></div><div class="card" style="margin-top:12px"><div class="between"><b>★ ${p.rating||5} <span class="muted">(128)</span></b><span class="pill green">● Atende sua região</span></div><p class="subtitle">${esc(p.bio||'Profissional qualificado para atender seu serviço.')}</p><div class="between"><span>A partir de</span><b class="price">${money(p.price||0)}</b></div></div><button class="btn primary full" style="margin-top:12px" onclick="requestQuote(${p.id})">Solicitar orçamento</button><button class="btn outline full" style="margin-top:8px" onclick="closeModal()">Fechar</button>`)}
function requestQuote(proId){let p=db.users.find(x=>x.id===proId);modal(`<div class="between"><h2>Solicitar orçamento</h2><button class="iconbtn" onclick="closeModal()">×</button></div><p class="muted">O profissional receberá os dados da solicitação.</p><div class="field"><label>Tipo de serviço</label><select id="rqService"><option>${esc(p.service||'Serviço')}</option>${cats.map(c=>`<option>${c[1]}</option>`).join('')}</select></div><div class="field"><label>Descrição do serviço</label><textarea id="rqDesc" placeholder="Conte mais detalhes sobre o serviço..."></textarea></div><div class="field"><label>Local do serviço</label><input id="rqLoc" placeholder="Digite o endereço ou bairro"></div><div class="field"><label>Data preferencial</label><input id="rqDate" type="date"></div><button class="btn primary full" onclick="sendRequest(${p.id})">Enviar solicitação</button><p class="tiny muted" style="text-align:center">Você receberá uma confirmação por WhatsApp e e-mail.</p>`)}
function sendRequest(proId){let u=me();let r={id:Date.now(),clientId:u.id,proId,service:document.getElementById('rqService').value,description:document.getElementById('rqDesc').value,location:document.getElementById('rqLoc').value,date:document.getElementById('rqDate').value||'A combinar',price:0,status:'Em aberto',created:'Agora'};db.requests.unshift(r);save();closeModal();toast('Solicitação enviada!');renderClient('requests')}
function requestClientCard(r){let p=db.users.find(x=>x.id===r.proId), status=r.status;return `<div class="item"><div class="between"><div><b>${esc(r.service)}</b><div class="tiny muted">${esc(p?.name||'Profissional')} • ${esc(r.created)}</div></div><span class="pill ${status==='Aceita'?'green':status==='Recusada'?'red':'yellow'}">${status}</span></div><p class="muted tiny">${esc(r.description||'Sem descrição')}</p><div class="between"><span class="tiny">📍 ${esc(r.location)}</span><b class="price">${r.price?money(r.price):'Aguardando orçamento'}</b></div></div>`}
function renderPro(page){let u=me();let rs=db.requests.filter(r=>r.proId===u.id);let content='';if(page==='home'){content=`${header('Painel do Profissional',u.profession||'Gerencie seus serviços e solicitações')}<div class="card"><div class="row"><div class="avatar lg">${u.name[0]}</div><div><b>${esc(u.name)}</b><div class="muted">${esc(u.profession||'Profissional')}</div><span class="pill green">${u.subscription?'● Assinatura Ativa':'Assinatura Inativa'}</span></div></div></div><div class="statgrid" style="margin-top:12px"><div class="stat"><strong>${rs.filter(r=>r.status==='Em aberto').length}</strong><span>Solicitações abertas</span></div><div class="stat"><strong>${rs.filter(r=>r.status==='Aceita').length}</strong><span>Aceitas</span></div><div class="stat"><strong>${money(u.price||0)}</strong><span>Preço base</span></div></div><div class="list" style="margin-top:14px"><div class="item" onclick="editPro()">👤 <b>Minha conta</b><div class="tiny muted">Edite seu perfil e dados profissionais</div></div><div class="item" onclick="renderPro('requests')">🧾 <b>Solicitações</b><div class="tiny muted">Veja os pedidos de orçamento</div></div><div class="item" onclick="editServices()">🛠️ <b>Meus serviços</b><div class="tiny muted">Gerencie serviços e preços</div></div><div class="item" onclick="renderPro('finance')">💰 <b>Financeiro</b><div class="tiny muted">Acompanhe pagamentos e assinatura</div></div><div class="item" onclick="showSupport()">🎧 <b>Suporte</b><div class="tiny muted">Entre em contato com o ADM</div></div></div>`}else if(page==='requests'){content=`${header('Solicitações de Serviço')}<div class="tabs"><button class="tab active">Em aberto (${rs.filter(r=>r.status==='Em aberto').length})</button><button class="tab">Aceitas (${rs.filter(r=>r.status==='Aceita').length})</button><button class="tab">Recusadas</button></div><div class="list">${rs.length?rs.map(proRequestCard).join(''):'<div class="empty card">Nenhuma solicitação recebida.</div>'}</div>`}else if(page==='finance'){let pay=db.payments.filter(x=>x.proId===u.id);content=`${header('Financeiro')}<div class="statgrid"><div class="stat"><strong>${money(pay.reduce((a,b)=>a+b.amount,0))}</strong><span>Pago em assinaturas</span></div><div class="stat"><strong>${u.subscription?'Ativa':'Inativa'}</strong><span>Assinatura</span></div><div class="stat"><strong>R$ 0,00</strong><span>Recebimentos</span></div></div><div class="card" style="margin-top:14px"><div class="between"><div><b>Plano mensal</b><div class="muted tiny">Acesso à plataforma e recebimento de solicitações</div></div><b class="price">${money(db.settings.planPrice)} / mês</b></div><ul class="tiny muted"><li>Acesso à plataforma</li><li>Receber solicitações</li><li>Aparecer nas buscas</li><li>Suporte prioritário</li></ul><button class="btn ${u.subscription?'outline':'primary'} full" onclick="subscribe()">${u.subscription?'Gerenciar assinatura':'Assinar agora'}</button></div><h3>Comprovantes</h3><div class="list">${pay.length?pay.map(p=>`<div class="item"><div class="between"><b>PIX - ${money(p.amount)}</b><span class="pill green">✓ ${p.status}</span></div><div class="tiny muted">${p.date}</div></div>`).join(''):'<div class="empty">Nenhum pagamento.</div>'}</div>`}else{content=`${header('Meu perfil')}<div class="card"><div class="row"><div class="avatar lg">${u.name[0]}</div><div><h2 style="margin:0">${esc(u.name)}</h2><div class="muted">${esc(u.email)}</div></div></div><div class="divider"></div><button class="btn ghost full" onclick="editPro()">Editar perfil profissional</button><button class="btn danger full" style="margin-top:10px" onclick="logout()">Sair</button></div>`}document.getElementById('app').innerHTML=`<div class="screen active"><div class="shell">${content}</div>${nav('pro',page)}</div>`}
function proRequestCard(r){let c=db.users.find(x=>x.id===r.clientId);return `<div class="item"><div class="between"><div class="row"><div class="avatar">${c?.name?.[0]||'C'}</div><div><b>${esc(c?.name||'Cliente')}</b><div class="tiny muted">${esc(r.service)} • ${esc(r.created)}</div></div></div><span class="pill yellow">${esc(r.status)}</span></div><p>${esc(r.description||'Sem descrição')}</p><div class="tiny muted">📍 ${esc(r.location)} • 📅 ${esc(r.date)}</div><div class="actions">${r.status==='Em aberto'?`<button class="btn danger" onclick="updateRequest(${r.id},'Recusada')">Recusar</button><button class="btn primary" onclick="acceptRequest(${r.id})">Aceitar</button>`:`<button class="btn outline" onclick="openWhats('${esc(c?.phone||'')}')">Falar com cliente</button>`}</div></div>`}
function acceptRequest(id){let r=db.requests.find(x=>x.id===id);modal(`<h2>Definir orçamento</h2><p class="muted">Informe o valor para aceitar a solicitação.</p><div class="field"><label>Valor do serviço</label><input id="quote" type="number" value="${r.price||''}" placeholder="Ex.: 150"></div><div class="field"><label>Observação</label><textarea id="quoteObs" placeholder="Prazo, materiais, condições..."></textarea></div><button class="btn primary full" onclick="confirmAccept(${id})">Enviar orçamento e aceitar</button>`)}function confirmAccept(id){let r=db.requests.find(x=>x.id===id);r.price=Number(document.getElementById('quote').value||0);r.status='Aceita';save();closeModal();toast('Orçamento enviado');renderPro('requests')}function updateRequest(id,status){let r=db.requests.find(x=>x.id===id);r.status=status;save();toast('Solicitação atualizada');renderPro('requests')}
function subscribe(){let u=me();let amount=db.settings.planPrice;modal(`<div class="between"><h2>Assinatura Profissional</h2><button class="iconbtn" onclick="closeModal()">×</button></div><div class="card"><div class="between"><b>Plano mensal</b><b class="price">${money(amount)}</b></div><p class="tiny muted">Pagamento demonstrativo via PIX. Em produção, conecte um gateway.</p><div class="field"><label>Chave PIX</label><input value="conecta@pix" readonly></div><button class="btn primary full" onclick="confirmPayment()">Confirmar pagamento</button></div>`)}function confirmPayment(){let u=me();u.subscription=true;db.payments.push({id:Date.now(),proId:u.id,amount:db.settings.planPrice,date:new Date().toLocaleString('pt-BR'),status:'Confirmado'});save();closeModal();toast('Pagamento confirmado!');renderPro('finance')}
function editPro(){let u=me();modal(`<h2>Editar perfil profissional</h2><div class="field"><label>Nome</label><input id="epName" value="${esc(u.name)}"></div><div class="field"><label>Profissão</label><input id="epProf" value="${esc(u.profession||'')}"></div><div class="field"><label>Categoria</label><select id="epService">${cats.slice(0,7).map(c=>`<option ${u.service===c[1]?'selected':''}>${c[1]}</option>`).join('')}</select></div><div class="field"><label>Preço a partir de</label><input id="epPrice" type="number" value="${u.price||0}"></div><div class="field"><label>Sobre você</label><textarea id="epBio">${esc(u.bio||'')}</textarea></div><button class="btn primary full" onclick="savePro()">Salvar alterações</button>`)}function savePro(){let u=me();u.name=document.getElementById('epName').value;u.profession=document.getElementById('epProf').value;u.service=document.getElementById('epService').value;u.price=Number(document.getElementById('epPrice').value);u.bio=document.getElementById('epBio').value;save();closeModal();toast('Perfil atualizado');renderPro('home')}
function editServices(){editPro()}function editProfile(){let u=me();modal(`<h2>Editar meus dados</h2><div class="field"><label>Nome</label><input id="clName" value="${esc(u.name)}"></div><div class="field"><label>Telefone</label><input id="clPhone" value="${esc(u.phone||'')}"></div><div class="field"><label>Cidade</label><input id="clCity" value="${esc(u.city||'')}"></div><button class="btn primary full" onclick="saveClient()">Salvar</button>`)}function saveClient(){let u=me();u.name=document.getElementById('clName').value;u.phone=document.getElementById('clPhone').value;u.city=document.getElementById('clCity').value;save();closeModal();renderClient('profile');toast('Dados atualizados')}
function renderAdmin(page){let u=me(),content='';let clients=db.users.filter(x=>x.role==='client'),pros=db.users.filter(x=>x.role==='pro');if(page==='home'){content=`${header('Painel Administrativo','Controle geral da plataforma')}<div class="adminhead"><div class="row"><div class="avatar lg">J</div><div><b>Jeferson Carvalho</b><div class="muted">Administrador</div><span class="pill green">● Online</span></div></div></div><div class="statgrid" style="margin-top:12px"><div class="stat"><strong>${clients.length}</strong><span>Clientes</span></div><div class="stat"><strong>${pros.length}</strong><span>Profissionais</span></div><div class="stat"><strong>${db.requests.length}</strong><span>Solicitações</span></div></div><div class="list" style="margin-top:14px"><div class="item" onclick="renderAdmin('users')">👥 <b>Usuários</b><div class="tiny muted">Gerencie clientes e profissionais</div></div><div class="item" onclick="adminSubscriptions()">💳 <b>Assinaturas</b><div class="tiny muted">Confirme pagamentos e libere acessos</div></div><div class="item" onclick="adminRequests()">🧾 <b>Solicitações</b><div class="tiny muted">Acompanhe todas as solicitações</div></div><div class="item" onclick="renderAdmin('finance')">💰 <b>Financeiro</b><div class="tiny muted">Relatórios e movimentações</div></div><div class="item" onclick="settings()">⚙️ <b>Configurações</b><div class="tiny muted">Ajustes do sistema</div></div></div><button class="btn danger full" style="margin-top:14px" onclick="logout()">Sair</button>`}else if(page==='users'){content=`${header('Usuários')}<div class="search"><span>⌕</span><input id="uq" placeholder="Buscar por nome, e-mail ou cidade" oninput="adminFilterUsers()"></div><div id="userlist" class="list">${userCards(db.users.filter(x=>x.role!=='admin'))}</div>`}else if(page==='finance'){let total=db.payments.reduce((a,b)=>a+b.amount,0);content=`${header('Financeiro')}<div class="statgrid"><div class="stat"><strong>${money(total)}</strong><span>Receita de assinaturas</span></div><div class="stat"><strong>${db.payments.length}</strong><span>Pagamentos</span></div><div class="stat"><strong>${money(db.settings.planPrice)}</strong><span>Plano mensal</span></div></div><div class="list" style="margin-top:14px">${db.payments.map(p=>{let x=db.users.find(u=>u.id===p.proId);return `<div class="item"><div class="between"><b>${esc(x?.name||'Profissional')}</b><span class="price">${money(p.amount)}</span></div><div class="tiny muted">${p.date} • PIX • ${p.status}</div></div>`}).join('')||'<div class="empty">Nenhuma movimentação.</div>'}</div>`}else{content=''}document.getElementById('app').innerHTML=`<div class="screen active"><div class="shell">${content}</div>${nav('admin',page)}</div>`}
function userCards(arr){return arr.map(x=>`<div class="item"><div class="between"><div class="row"><div class="avatar">${x.name[0]}</div><div><b>${esc(x.name)}</b><div class="tiny muted">${esc(x.email)} • ${esc(x.city)}</div><div class="tiny">${x.role==='pro'?'Profissional':'Cliente'}</div></div></div><span class="pill ${x.status==='Ativo'?'green':'red'}">${x.status}</span></div><div class="actions"><button class="btn outline" onclick="viewUser(${x.id})">Detalhes</button><button class="btn ${x.status==='Ativo'?'danger':'success'}" onclick="toggleUser(${x.id})">${x.status==='Ativo'?'Suspender':'Ativar'}</button>${x.role==='client'?`<button class="btn ghost" onclick="protectClientAction('edit',${x.id})">Editar</button><button class="btn danger" onclick="protectClientAction('delete',${x.id})">Excluir</button>`:''}</div></div>`).join('')}
function adminFilterUsers(){let q=document.getElementById('uq').value.toLowerCase();document.getElementById('userlist').innerHTML=userCards(db.users.filter(x=>x.role!=='admin'&&[x.name,x.email,x.city].join(' ').toLowerCase().includes(q)))}function toggleUser(id){let u=db.users.find(x=>x.id===id);u.status=u.status==='Ativo'?'Suspenso':'Ativo';save();renderAdmin('users');toast('Status atualizado')}function protectClientAction(action,id){modal(`<div class="between"><h2>${action==='edit'?'Editar cliente':'Excluir cliente'}</h2><button class="iconbtn" onclick="closeModal()">×</button></div><p class="muted">Digite a senha de autorização do ADM para continuar.</p><div class="field"><label>Senha de autorização</label><input id="clientActionPass" type="password" inputmode="numeric" placeholder="Digite a senha"></div><button class="btn ${action==='delete'?'danger':'primary'} full" onclick="verifyClientAction('${action}',${id})">${action==='edit'?'Liberar edição':'Liberar exclusão'}</button>`)}function verifyClientAction(action,id){let pass=document.getElementById('clientActionPass').value;if(pass!=='26'){toast('Senha de autorização incorreta');return}closeModal();if(action==='edit')editAdminClient(id);else deleteAdminClient(id)}function editAdminClient(id){let u=db.users.find(x=>x.id===id);if(!u||u.role!=='client')return;modal(`<div class="between"><h2>Editar cliente</h2><button class="iconbtn" onclick="closeModal()">×</button></div><div class="field"><label>Nome</label><input id="acName" value="${esc(u.name)}"></div><div class="field"><label>E-mail</label><input id="acEmail" type="email" value="${esc(u.email)}"></div><div class="field"><label>Telefone</label><input id="acPhone" value="${esc(u.phone||'')}"></div><div class="field"><label>Cidade</label><input id="acCity" value="${esc(u.city||'')}"></div><div class="field"><label>Status</label><select id="acStatus"><option ${u.status==='Ativo'?'selected':''}>Ativo</option><option ${u.status==='Suspenso'?'selected':''}>Suspenso</option></select></div><button class="btn primary full" onclick="saveAdminClient(${id})">Salvar alterações</button>`)}function saveAdminClient(id){let u=db.users.find(x=>x.id===id);let email=document.getElementById('acEmail').value.trim().toLowerCase();if(!u)return;if(!email){toast('Informe o e-mail');return}if(db.users.some(x=>x.id!==id&&x.email.toLowerCase()===email)){toast('E-mail já cadastrado');return}u.name=document.getElementById('acName').value.trim()||u.name;u.email=email;u.phone=document.getElementById('acPhone').value.trim();u.city=document.getElementById('acCity').value.trim();u.status=document.getElementById('acStatus').value;save();closeModal();renderAdmin('users');toast('Cliente atualizado com sucesso')}function deleteAdminClient(id){let u=db.users.find(x=>x.id===id);if(!u||u.role!=='client')return;if(!confirm(`Excluir definitivamente o cliente ${u.name}?`))return;db.users=db.users.filter(x=>x.id!==id);db.requests=db.requests.filter(r=>r.clientId!==id);save();renderAdmin('users');toast('Cliente excluído')}function viewUser(id){let u=db.users.find(x=>x.id===id);modal(`<div class="row"><div class="avatar lg">${u.name[0]}</div><div><h2 style="margin:0">${esc(u.name)}</h2><div class="muted">${esc(u.email)}</div></div></div><div class="divider"></div><p><b>Tipo:</b> ${u.role==='pro'?'Profissional':'Cliente'}</p><p><b>Cidade:</b> ${esc(u.city)}</p><p><b>Status:</b> ${u.status}</p>${u.role==='pro'?`<p><b>Serviço:</b> ${esc(u.service||'')}</p><p><b>Assinatura:</b> ${u.subscription?'Ativa':'Inativa'}</p>`:''}<button class="btn outline full" onclick="closeModal()">Fechar</button>`)}
function adminSubscriptions(){let ps=db.users.filter(x=>x.role==='pro');modal(`<h2>Assinaturas</h2><div class="list">${ps.map(p=>`<div class="item"><div class="between"><div><b>${esc(p.name)}</b><div class="tiny muted">${esc(p.profession||'Profissional')}</div></div><span class="pill ${p.subscription?'green':'red'}">${p.subscription?'Ativa':'Inativa'}</span></div><button class="btn ${p.subscription?'danger':'success'} full" style="margin-top:9px" onclick="toggleSub(${p.id})">${p.subscription?'Bloquear assinatura':'Liberar acesso'}</button></div>`).join('')}</div>`)}function toggleSub(id){let u=db.users.find(x=>x.id===id);u.subscription=!u.subscription;save();closeModal();adminSubscriptions();toast('Assinatura atualizada')}function adminRequests(){modal(`<h2>Solicitações</h2><div class="list">${db.requests.map(r=>{let c=db.users.find(x=>x.id===r.clientId),p=db.users.find(x=>x.id===r.proId);return `<div class="item"><div class="between"><b>${esc(r.service)}</b><span class="pill">${r.status}</span></div><div class="tiny muted">${esc(c?.name||'')} → ${esc(p?.name||'')}</div><div class="tiny">${esc(r.description)}</div></div>`}).join('')}</div>`)}function settings(){modal(`<h2>Configurações</h2><div class="field"><label>Valor da assinatura mensal</label><input id="plan" type="number" step="0.01" value="${db.settings.planPrice}"></div><button class="btn primary full" onclick="saveSettings()">Salvar configurações</button>`)}function saveSettings(){db.settings.planPrice=Number(document.getElementById('plan').value||4.99);save();closeModal();toast('Configurações salvas')}function showNotifications(){modal(`<h2>Notificações</h2><div class="item">🔔 <b>Nova solicitação</b><div class="tiny muted">Há solicitações e atualizações disponíveis.</div></div><div class="item" style="margin-top:10px">🛡️ <b>Segurança</b><div class="tiny muted">Seus dados estão protegidos nesta demonstração.</div></div>`)}function showSupport(){modal(`<h2>Suporte</h2><p class="muted">Fale com o ADM pelo WhatsApp.</p><button class="btn success full" onclick="openWhats('5579999055301')">Abrir WhatsApp</button>`)}function openWhats(phone){window.open('https://wa.me/'+String(phone).replace(/\D/g,''),'_blank')}
let deferredInstallPrompt=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;const b=document.getElementById('installBtn');if(b)b.style.display='none';toast('Aplicativo instalado com sucesso!')});
async function installApp(){
  if(isStandalone){toast('O Conecta Serviços já está instalado.');return;}
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt=null;
    return;
  }
  if(isIOS){
    toast('No iPhone: toque em Compartilhar → Adicionar à Tela de Início.');
    return;
  }
  toast('No Android/Chrome: abra o menu ⋮ e escolha “Instalar aplicativo” ou “Adicionar à tela inicial”.');
}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{}))}

route();
</script></body></html>
